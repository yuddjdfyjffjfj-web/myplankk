<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K</title>
<style>
  :root { box-sizing: border-box; color-scheme: dark; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #glow { position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 42% 36% at 50% 52%, rgba(230,0,85,.20), rgba(0,0,0,0) 72%); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #btns { position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    display:flex; gap:10px; justify-content:center; }
  #btns button { background:#000; color:#aaa; border:1px solid #555; border-radius:20px;
    padding:10px 16px; font:14px Arial, sans-serif; cursor:pointer; }

  #btns #bS { background:linear-gradient(135deg,#ff2d6f,#c4124c); color:#fff; border:0; font-weight:700; padding:12px 26px; font-size:15px;
    box-shadow:0 0 18px rgba(255,45,111,.7); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.07); } }
  #sur { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px); color:#fff; font-family:Georgia,serif; text-align:center; overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%, rgba(120,0,45,.9), rgba(0,0,0,.97) 70%); }
  #sur .box { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:14px; max-width:420px; width:100%; }
  #sur input { width:100%; box-sizing:border-box; padding:12px 14px; border-radius:14px; border:1px solid #ff5c93; background:#111; color:#fff; font-size:17px; text-align:center; }
  #sur input:focus { outline:none; box-shadow:0 0 16px rgba(255,45,111,.7); }
  #sur button { background:linear-gradient(135deg,#ff2d6f,#c4124c); color:#fff; border:0; border-radius:20px; padding:11px 34px; font-size:15px; cursor:pointer; box-shadow:0 0 16px rgba(255,45,111,.6); }
  #sur button.ghost { background:transparent; color:#999; border:1px solid #444; box-shadow:none; padding:10px 22px; }
  #err { color:#ff8fb3; min-height:20px; font:14px Arial,sans-serif; }
  #lock { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; box-sizing:border-box; padding:30px 24px; border-radius:28px;
    border:1px solid rgba(255,120,170,.35); background:rgba(40,0,16,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); box-shadow:0 0 50px rgba(255,45,111,.3); }
  #rev { display:none; flex-direction:column; align-items:center; gap:18px; }
  .beat { font-size:46px; animation:pulse 1.4s ease-in-out infinite; }
  .ttl { font-size:26px; font-style:italic; color:#ffd1e0; text-shadow:0 0 14px rgba(255,90,140,.9); }
  .sub { font:13px Arial,sans-serif; color:#c58aa0; margin-top:-6px; }
  #pic { max-width:100%; max-height:62vh; border-radius:22px; border:2px solid rgba(255,170,200,.9);
    box-shadow:0 0 0 6px rgba(255,45,111,.12), 0 0 60px rgba(255,45,111,.65); animation:pop .9s ease both; }
  #msg { font-size:28px; line-height:1.25; font-style:italic; font-weight:700; min-height:36px;
    background:linear-gradient(90deg,#fff,#ffb3cd,#ff5c93,#ffb3cd,#fff); background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 12px rgba(255,90,140,.8)); animation:pop 1.4s ease both, shine 4s linear infinite; }
  .fh { position:absolute; bottom:-40px; color:#ff5c93; opacity:.8; pointer-events:none; z-index:0; animation:rise 5s linear forwards; }
  @keyframes pop { from { opacity:0; transform:scale(.92) translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes shake { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
  @keyframes shine { to { background-position:-250% 0; } }
  @keyframes rise { to { transform:translateY(-110vh) rotate(25deg); opacity:0; } }
</style>
</head>
<body>
<div id="glow"></div>
<canvas id="c"></canvas>
<div id="btns">
    <button id="bS">💗 Сюрприз</button>
</div>
<div id="sur"><div class="box">
  <div id="lock">
    <div class="beat">💗</div>
    <div class="ttl">Секретный сюрприз</div>
    <div class="sub">Введи пароль, чтобы открыть</div>
    <input id="pw" type="password" autocomplete="off" placeholder="Пароль">
    <div id="err"></div>
    <button id="go">Открыть</button>
    <button id="x" class="ghost">Закрыть</button>
  </div>
  <div id="rev">
    <img id="pic" alt="">
    <div id="msg"></div>
    <button id="x2" class="ghost">Закрыть</button>
  </div>
</div></div>
<script>
(function(){
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W, H, S, dpr;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    S = Math.min(W*0.8, H*1.1) * 0.36;
  }
  resize(); window.addEventListener('resize', resize);

  /* ---------- Photos behind the heart ---------- */
  var cards = { D:null, R:null };
  function makeCard(img){
    var cw = 420, ch = 600, c = document.createElement('canvas'), g = c.getContext('2d');
    c.width = cw; c.height = ch;
    var sc = Math.max(cw/img.naturalWidth, ch/img.naturalHeight);
    var w = img.naturalWidth*sc, h = img.naturalHeight*sc;
    g.drawImage(img, (cw-w)/2, (ch-h)/2, w, h);
    g.globalCompositeOperation = 'destination-in';
    g.save(); g.translate(cw/2, ch/2); g.scale(1, ch/cw);
    var gr = g.createRadialGradient(0,0,cw*0.3, 0,0,cw*0.5);
    gr.addColorStop(0,'rgba(0,0,0,1)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(-cw/2,-cw/2,cw,cw);
    g.restore();
    return c;
  }
  function setPhoto(key, url){
    var im = new Image();
    im.onload = function(){
      cards[key] = makeCard(im);
      var bb=document.getElementById('b'+key); if(bb) bb.style.display='none';
    };
    im.src = url;
  }
  function tryLoad(key, name){
    var exts = ['jpg','jpeg','png','webp'], i = 0;

      im.onload = function(){ cards[key] = makeCard(im); document.getElementById('b'+key).style.display='none'; };
      im.onerror = next;
      im.src = src;
    })();

        if (!cd) continue;
        var wob = Math.sin(t*0.0009 + pi*1.7)*H*0.01;
        ctx.globalAlpha = 0.7*vis;
        ctx.drawImage(cd, W*pos[pi][0]-sw/2, H*pos[pi][1]-sm/2+wob, sw, sm);
      }
      // big photo stuck behind the heart
      if (cards.D){
        ctx.globalAlpha = 0.92*vis;
        ctx.drawImage(cards.D, cx - cw/2, cy - ch/2 + fl, cw, ch);
      }
      ctx.globalAlpha = 1;
    }

    for (var n=0;n<N;n++){
      var it = items[n];
      var q = Math.min(1, Math.max(0, (ct - it.d*1000)/1800));
      var e = 1 - Math.pow(1 - q, 3);
      var u = Math.min(1, Math.max(0, (ct - 13000 - it.d*300)/1400));
      e = e*(1 - u*u*u); q = q*(1 - u);
      var sx = Math.cos(it.a0)*it.rd, sy = Math.sin(it.a0)*it.rd;
      var hx = it.x*ca - it.z*sa, hz = it.x*sa + it.z*ca;
      var nx = sx + (hx - sx)*e, ny = sy + (it.y - sy)*e;
      var f = 3/(3 - hz);
      it.px = cx + nx*S*beat*f; it.py = cy - ny*S*beat*f;
      it.f = f; it.rz = hz; it.q = q; it.e = e;
    }
    items.sort(function(a,b){ return a.rz - b.rz; });

    for (var n2=0;n2<N;n2++){
      var p2 = items[n2];
      var al = (0.5 + 0.5*Math.min(1, Math.max(0, (p2.rz + 0.5)/1.0))) * Math.min(1, p2.q*4);
      if (al <= 0.01) continue;
      ctx.globalAlpha = al;
      var sc = p2.s * p2.f * (S/330);
      ctx.setTransform(sc*dpr,0,0,sc*dpr,p2.px*dpr,p2.py*dpr);
      ctx.rotate(p2.r + p2.r0*(1 - p2.e));
      ctx.transform(1,0,p2.sh,1,0,0);
      ctx.drawImage(sprites[p2.k], -85, -28, 170, 56);
    }

    ctx.globalAlpha = Math.min(1, Math.max(0, (ct - 2500)/1500)) * Math.min(1, Math.max(0, (13500 - ct)/800));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font = '600 ' + Math.round(S*0.55) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,90,140,.95)'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#fff';
    ctx.fillText('K', cx, cy + S*0.02);
    ctx.shadowBlur = 0;

    requestAnimationFrame(frame);
  }

  var sur=document.getElementById('sur'), lock=document.getElementById('lock'), rev=document.getElementById('rev'),
      pw=document.getElementById('pw'), err=document.getElementById('err'), pic=document.getElementById('pic'), msg=document.getElementById('msg');
  function hearts(){
    for (var i=0;i<18;i++){
      var h=document.createElement('div'); h.className='fh'; h.textContent='💗';
      h.style.left=Math.random()*100+'%'; h.style.fontSize=(16+Math.random()*26)+'px'; h.style.animationDelay=(Math.random()*2)+'s';
      sur.appendChild(h); setTimeout((function(el){return function(){el.remove();};})(h), 8000);
    }
  }
  var hi = null;
  function closeSur(){ sur.style.display='none'; rev.style.display='none'; pic.removeAttribute('src'); msg.textContent=''; if (hi){ clearInterval(hi); hi=null; } }
  document.getElementById('bS').addEventListener('click', function(e){
    e.stopPropagation();
    lock.style.display='flex'; rev.style.display='none'; pw.value=''; err.textContent='';
    sur.style.display='flex'; pw.focus();
  });
  function decrypt(pass){
    var raw = Uint8Array.from(atob(BLOB), function(c){ return c.charCodeAt(0); });
    var salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){ return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']); })
      .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ct); })
      .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
  }
  function check(){
    if (!window.crypto || !crypto.subtle){ err.textContent = 'Открой файл в Chrome или Edge'; return; }
    err.textContent = '…';
    decrypt(pw.value.trim()).then(function(d){
      err.textContent = '';
      lock.style.display='none'; rev.style.display='flex';
      pic.src = d.img; msg.textContent = d.msg;
      hearts(); hi = setInterval(hearts, 4000);
    }).catch(function(){
      err.textContent = 'Неверный пароль 🙈';
      lock.style.animation='none'; void lock.offsetWidth; lock.style.animation='shake .4s';
    });
  }
  document.getElementById('go').addEventListener('click', check);
  pw.addEventListener('keydown', function(e){ if (e.key==='Enter') check(); });
  document.getElementById('x').addEventListener('click', closeSur);
  document.getElementById('x2').addEventListener('click', closeSur);
